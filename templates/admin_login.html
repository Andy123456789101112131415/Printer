{% extends "base.html" %}
{% block content %}
<h1>Admin Login</h1>
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Password
    <input type="password" name="password" required autofocus>
  </label>
  <button type="submit">Log In</button>
</form>
{% endblock %}
